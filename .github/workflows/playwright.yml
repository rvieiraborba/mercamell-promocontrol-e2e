name: Playwright E2E - Mercamell PromoControl

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout automação E2E
        uses: actions/checkout@v4
      - name: Checkout da aplicação (repositório separado)
        uses: actions/checkout@v4
        with:
          repository: rvieiraborba/mercamell-promocontrol
          ref: main
          path: _application
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências dos testes
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium e bibliotecas
        run: npx playwright install --with-deps chromium
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Executar Playwright
        run: npm test
      - name: Anexar relatório de testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14